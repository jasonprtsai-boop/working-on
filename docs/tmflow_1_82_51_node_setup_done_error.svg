<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="558" viewBox="0 0 1242 558" role="img" aria-label="完成回報與錯誤出口"><style>text{font-family:Microsoft JhengHei,Arial,sans-serif;letter-spacing:0}</style><rect width="100%" height="100%" fill="#f6f8f9"/><text x="28" y="42" font-size="25" fill="#263238">完成回報與錯誤出口</text><text x="28" y="74" font-size="15" fill="#526167">v3.0 / 2026-09-18 / 設計規格，尚未整合實機執行</text><rect x="20" y="108" width="592" height="40" fill="#24675d"/><text x="34" y="136" font-size="20" fill="#ffffff">F  完成與下一輪</text><rect x="20" y="162" width="592" height="112" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="187" font-size="18" fill="#0b5d52">F1  |  Set</text><text x="34" y="213" font-size="17" fill="#263238">保存 DONE、cmd_id、capture_id；status=2、robot_state=1</text><text x="34" y="237" font-size="17" fill="#263238">。</text><text x="34" y="263" font-size="14" fill="#5b6269">下一步: F2</text><rect x="20" y="285" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="310" font-size="18" fill="#0b5d52">F2  |  Network</text><text x="34" y="336" font-size="17" fill="#263238">回 DONE 與編號：動作及拍攝結束，不等於辨識通過。</text><text x="34" y="362" font-size="14" fill="#5b6269">下一步: F3 / 失敗: G1</text><rect x="20" y="384" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="409" font-size="18" fill="#0b5d52">F3  |  Set</text><text x="34" y="435" font-size="17" fill="#263238">cmd_ready=false；保留完成編號及結果；回 Listen。</text><text x="34" y="461" font-size="14" fill="#5b6269">下一步: L1</text><rect x="630" y="108" width="592" height="40" fill="#9b3434"/><text x="644" y="136" font-size="20" fill="#ffffff">G  明確失敗出口</text><rect x="630" y="162" width="592" height="112" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="187" font-size="18" fill="#0b5d52">G1  |  Set</text><text x="644" y="213" font-size="17" fill="#263238">保存故障上下文；活動命令未結束才存 ERR，不覆蓋既有 DONE；不強</text><text x="644" y="237" font-size="17" fill="#263238">制切 DO3。</text><text x="644" y="263" font-size="14" fill="#5b6269">下一步: G2</text><rect x="630" y="285" width="592" height="112" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="310" font-size="18" fill="#0b5d52">G2  |  Network</text><text x="644" y="336" font-size="17" fill="#263238">限時回故障通知；已有 DONE 則重送 DONE 並另報通訊故障；失敗也</text><text x="644" y="360" font-size="17" fill="#263238">停止。</text><text x="644" y="386" font-size="14" fill="#5b6269">下一步: G3 / 失敗: G3</text><rect x="630" y="408" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="433" font-size="18" fill="#0b5d52">G3  |  Stop</text><text x="644" y="459" font-size="17" fill="#263238">停止專案、保留結果；依現場持物狀態人工復歸。</text><text x="644" y="485" font-size="14" fill="#5b6269">停止</text></svg>