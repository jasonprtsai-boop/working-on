<svg xmlns="http://www.w3.org/2000/svg" width="632" height="1203" viewBox="0 0 632 1203" role="img" aria-label="吃子與死棋盒路徑"><style>text{font-family:Microsoft JhengHei,Arial,sans-serif;letter-spacing:0}</style><rect width="100%" height="100%" fill="#f6f8f9"/><text x="28" y="42" font-size="25" fill="#263238">吃子與死棋盒路徑</text><text x="28" y="74" font-size="15" fill="#526167">v3.0 / 2026-09-18 / 設計規格，尚未整合實機執行</text><rect x="20" y="108" width="592" height="40" fill="#24675d"/><text x="34" y="136" font-size="20" fill="#ffffff">C  吃子：先移除目標棋</text><rect x="20" y="162" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="187" font-size="18" fill="#0b5d52">C1  |  Point</text><text x="34" y="213" font-size="17" fill="#263238">P_DST_ABOVE；Line，安全高度已校驗路徑。</text><text x="34" y="239" font-size="14" fill="#5b6269">下一步: C2 / 失敗: G1</text><rect x="20" y="261" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="286" font-size="18" fill="#0b5d52">C2  |  Point</text><text x="34" y="312" font-size="17" fill="#263238">P_DST_PICK；Line 垂直下降、精準到位。</text><text x="34" y="338" font-size="14" fill="#5b6269">下一步: C3 / 失敗: G1</text><rect x="20" y="360" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="385" font-size="18" fill="#0b5d52">C3  |  Set / IO</text><text x="34" y="411" font-size="17" fill="#263238">DO3=SUCTION_LEVEL；只代表吸盤已啟動。</text><text x="34" y="437" font-size="14" fill="#5b6269">下一步: C4</text><rect x="20" y="459" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="484" font-size="18" fill="#0b5d52">C4  |  Wait for</text><text x="34" y="510" font-size="17" fill="#263238">等待 grip_wait_ms；無回授不宣稱已吸住。</text><text x="34" y="536" font-size="14" fill="#5b6269">下一步: C5</text><rect x="20" y="558" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="583" font-size="18" fill="#0b5d52">C5  |  Point</text><text x="34" y="609" font-size="17" fill="#263238">P_DST_ABOVE；Line 垂直抬升。</text><text x="34" y="635" font-size="14" fill="#5b6269">下一步: C6 / 失敗: G1</text><rect x="20" y="657" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="682" font-size="18" fill="#0b5d52">C6  |  Point</text><text x="34" y="708" font-size="17" fill="#263238">P_DROP_ABOVE；Line，維持已校驗高度與姿態。</text><text x="34" y="734" font-size="14" fill="#5b6269">下一步: C7 / 失敗: G1</text><rect x="20" y="756" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="781" font-size="18" fill="#0b5d52">C7  |  Point</text><text x="34" y="807" font-size="17" fill="#263238">P_DROP_RELEASE；Line 垂直下降、精準到位。</text><text x="34" y="833" font-size="14" fill="#5b6269">下一步: C8 / 失敗: G1</text><rect x="20" y="855" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="880" font-size="18" fill="#0b5d52">C8  |  Set / IO</text><text x="34" y="906" font-size="17" fill="#263238">DO3=RELEASE_LEVEL；棋子落入收納盒。</text><text x="34" y="932" font-size="14" fill="#5b6269">下一步: C9</text><rect x="20" y="954" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="979" font-size="18" fill="#0b5d52">C9  |  Wait for</text><text x="34" y="1005" font-size="17" fill="#263238">等待 release_wait_ms。</text><text x="34" y="1031" font-size="14" fill="#5b6269">下一步: C10</text><rect x="20" y="1053" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="1078" font-size="18" fill="#0b5d52">C10  |  Point</text><text x="34" y="1104" font-size="17" fill="#263238">P_DROP_ABOVE；Line 垂直抬升。</text><text x="34" y="1130" font-size="14" fill="#5b6269">下一步: M1 / 失敗: G1</text></svg>