<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1600" viewBox="0 0 3000 1600" role="img" aria-labelledby="title desc">
  <title id="title">Python 與 TMflow 資料交換（現場修正版）</title>
  <desc id="desc">目前測 Move 時先跳過通訊；正式版仍使用 Listen 與 Network。</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#32455f" /></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#158a4d" /></marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#cf3030" /></marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#10223f" flood-opacity="0.11"/></filter>
  </defs>
  <style>
    :root{--bg:#f5f7fb;--ink:#142033;--muted:#5b6b83;--border:#c6d3e5;--blue:#2f7cf6;--blue-soft:#e7f1ff;--cyan:#0891b2;--cyan-soft:#e7fbff;--green:#169b55;--green-soft:#e8f8ef;--orange:#ef7b22;--orange-soft:#fff3e3;--red:#d43b3b;--red-soft:#ffe9e9;--purple:#7c3aed;--purple-soft:#f1eaff;--yellow:#c99400;--yellow-soft:#fff7d1}
    .bg{fill:var(--bg)} .title{fill:var(--ink);font:600 44px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}.subtitle{fill:var(--muted);font:400 24px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}.body{fill:var(--ink);font:400 21px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}.small{fill:var(--muted);font:400 18px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}
    .lane-box,.node-box,.panel{fill:#fff;stroke:var(--border);stroke-width:2.2;filter:url(#shadow)}.lane-head,.lane-head-cover{fill:var(--blue-soft)}.lane.orange .lane-head,.lane.orange .lane-head-cover{fill:var(--orange-soft)}.lane.green .lane-head,.lane.green .lane-head-cover{fill:var(--green-soft)}.lane.cyan .lane-head,.lane.cyan .lane-head-cover{fill:var(--cyan-soft)}.lane.red .lane-head,.lane.red .lane-head-cover{fill:var(--red-soft)}.lane-title{fill:var(--ink);font:600 24px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}
    .node-id{fill:var(--ink);font:600 24px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}.node-body{fill:#273853;font:400 19px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}.node-strip{fill:var(--blue)}.node.orange .node-strip{fill:var(--orange)}.node.green .node-strip{fill:var(--green)}.node.cyan .node-strip{fill:var(--cyan)}.node.red .node-strip{fill:var(--red)}.type-pill{fill:#edf3fa;stroke:#d8e2ee;stroke-width:1}.type-text{fill:var(--muted);font:600 15px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}
    .label-bg{fill:var(--bg);stroke:#c7d3e4;stroke-width:1.2}.edge-label{fill:#40506a;font:600 17px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}.warn{fill:#b91c1c;font:600 21px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}.ok{fill:#166534;font:600 21px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}
  </style>
  <rect class="bg" width="3000" height="1600"/>
  <text class="title" text-anchor="start" font-weight="600"><tspan x="60" y="70">Python 與 TMflow 資料交換（現場修正版）</tspan></text>
  <text class="subtitle" text-anchor="start"><tspan x="60" y="110">目前測 Move 時先跳過通訊；正式版仍使用 Listen 與 Network。</tspan></text>
  <g class="node cyan">
    <rect class="node-box" x="120" y="320" width="470" height="210" rx="12"/>
    <rect class="node-strip" x="120" y="320" width="12" height="210" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="144" y="358">網站</tspan></text>
    <rect class="type-pill" x="452" y="335" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="510" y="357">UI</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="144" y="392">玩家按我已下棋</tspan></text>
  </g><g class="node cyan">
    <rect class="node-box" x="680" y="320" width="470" height="210" rx="12"/>
    <rect class="node-strip" x="680" y="320" width="12" height="210" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="704" y="358">Python</tspan></text>
    <rect class="type-pill" x="1012" y="335" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="1070" y="357">Vision/AI</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="704" y="392">YOLO/Pikafish 算出 from/to</tspan><tspan x="704" y="416">/action</tspan></text>
  </g><g class="node green">
    <rect class="node-box" x="1240" y="320" width="470" height="210" rx="12"/>
    <rect class="node-strip" x="1240" y="320" width="12" height="210" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="1264" y="358">TMflow</tspan></text>
    <rect class="type-pill" x="1572" y="335" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="1630" y="357">Listen</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="1264" y="392">Listen1 接收外部命令</tspan></text>
  </g><g class="node green">
    <rect class="node-box" x="1800" y="320" width="470" height="210" rx="12"/>
    <rect class="node-strip" x="1800" y="320" width="12" height="210" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="1824" y="358">TMflow</tspan></text>
    <rect class="type-pill" x="2132" y="335" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="2190" y="357">Motion</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="1824" y="392">B/C/F 執行，後續補 G</tspan></text>
  </g><g class="node cyan">
    <rect class="node-box" x="2360" y="320" width="470" height="210" rx="12"/>
    <rect class="node-strip" x="2360" y="320" width="12" height="210" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="2384" y="358">Python</tspan></text>
    <rect class="type-pill" x="2692" y="335" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="2750" y="357">Network 9001</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="2384" y="392">收 READY/BUSY/DONE/ERR</tspan></text>
  </g><g><path d="M 590 425 L 680 425" fill="none" stroke="#32455f" stroke-width="4" marker-end="url(#arrow)" /></g><g><path d="M 1150 425 L 1240 425" fill="none" stroke="#32455f" stroke-width="4" marker-end="url(#arrow)" /></g><g><path d="M 1710 425 L 1800 425" fill="none" stroke="#32455f" stroke-width="4" marker-end="url(#arrow)" /></g><g><path d="M 2270 425 L 2360 425" fill="none" stroke="#32455f" stroke-width="4" marker-end="url(#arrow)" /></g><g class="node blue">
    <rect class="node-box" x="180" y="760" width="1200" height="220" rx="12"/>
    <rect class="node-strip" x="180" y="760" width="12" height="220" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="204" y="798">命令方向</tspan></text>
    <rect class="type-pill" x="1242" y="775" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="1300" y="797">Listen</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="204" y="832">正式版 Python -&gt; TMflow Listen1。安全假流程測試時先跳過 Listen1，直接</tspan><tspan x="204" y="856">從 A4 接 B1。</tspan></text>
  </g><g class="node cyan">
    <rect class="node-box" x="1620" y="760" width="1200" height="220" rx="12"/>
    <rect class="node-strip" x="1620" y="760" width="12" height="220" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="1644" y="798">狀態方向</tspan></text>
    <rect class="type-pill" x="2682" y="775" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="2740" y="797">Network</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="1644" y="832">TMflow -&gt; Python 9001。先用純文字 READY、HB、BUSY、DONE，確認後再</tspan><tspan x="1644" y="856">串 cmd_id。</tspan></text>
  </g><text class="warn" text-anchor="start"><tspan x="180" y="1180">此版本不把 ModbusDev 當節點；Network/Listen 等 Python 端確認後才加回主線。</tspan></text>
</svg>