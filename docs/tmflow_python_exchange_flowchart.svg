<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="800" viewBox="0 0 1136 800" role="img" aria-label="Python / TMflow / 雙張影像資料交換"><style>text{font-family:Microsoft JhengHei,Arial,sans-serif;letter-spacing:0}</style><rect width="100%" height="100%" fill="#f6f8f9"/><text x="28" y="42" font-size="25" fill="#263238">Python / TMflow / 雙張影像資料交換</text><text x="28" y="74" font-size="15" fill="#526167">v3.0 / 2026-09-18 / 設計規格，尚未整合實機執行</text><rect x="28" y="112" width="1080" height="106" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="44" y="142" font-size="20" fill="#0b5d52">PC → Listen</text><text x="310" y="142" font-size="18" fill="#263238">TMSCT：命令欄位＋5 個動態 Point.Value；收到 OK 再 ScriptExit()。</text><rect x="28" y="242" width="1080" height="106" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="44" y="272" font-size="20" fill="#0b5d52">TMflow → PC</text><text x="310" y="272" font-size="18" fill="#263238">Network：BUSY／DONE／ERR 都帶 session_id、cmd_id、capture_id。</text><rect x="28" y="372" width="1080" height="106" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="44" y="402" font-size="20" fill="#0b5d52">影像 A/B → PC</text><text x="310" y="402" font-size="18" fill="#263238">每張帶 capture_id 與 view；先接收回 ACK，不等待另一張。</text><rect x="28" y="502" width="1080" height="106" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="44" y="532" font-size="20" fill="#0b5d52">Python 內部</text><text x="310" y="532" font-size="18" fill="#263238">配對緩衝保存 A+B；兩張齊全且收到 DONE，才發布完整棋盤結果。</text><rect x="28" y="632" width="1080" height="106" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="44" y="662" font-size="20" fill="#0b5d52">下一輪</text><text x="310" y="662" font-size="18" fill="#263238">完成辨識／複驗後，等 TMflow 確實回 Listen 才送下一筆。</text></svg>