<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1251" viewBox="0 0 1242 1251" role="img" aria-label="開機與接令"><style>text{font-family:Microsoft JhengHei,Arial,sans-serif;letter-spacing:0}</style><rect width="100%" height="100%" fill="#f6f8f9"/><text x="28" y="42" font-size="25" fill="#263238">開機與接令</text><text x="28" y="74" font-size="15" fill="#526167">v3.0 / 2026-09-18 / 設計規格，尚未整合實機執行</text><rect x="20" y="108" width="592" height="40" fill="#24675d"/><text x="34" y="136" font-size="20" fill="#ffffff">A  啟動與等待</text><rect x="20" y="162" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="187" font-size="18" fill="#0b5d52">A1  |  Start</text><text x="34" y="213" font-size="17" fill="#263238">空載、已在已知起始區域時啟動；中斷持棋不走此入口。</text><text x="34" y="239" font-size="14" fill="#5b6269">下一步: A2</text><rect x="20" y="261" width="592" height="112" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="286" font-size="18" fill="#0b5d52">A2  |  Set</text><text x="34" y="312" font-size="17" fill="#263238">清空 bound_session_id 與命令快取；last_cmd_id=0、cmd_re</text><text x="34" y="336" font-size="17" fill="#263238">ady=false；只在新啟動執行。</text><text x="34" y="362" font-size="14" fill="#5b6269">下一步: A3</text><rect x="20" y="384" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="409" font-size="18" fill="#0b5d52">A3  |  Set / IO</text><text x="34" y="435" font-size="17" fill="#263238">DO3=RELEASE_LEVEL；初始化空載狀態。</text><text x="34" y="461" font-size="14" fill="#5b6269">下一步: A4</text><rect x="20" y="483" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="508" font-size="18" fill="#0b5d52">A4  |  Point</text><text x="34" y="534" font-size="17" fill="#263238">P_READY_SAFE；PTP，已校驗起始路徑，精準到位。</text><text x="34" y="560" font-size="14" fill="#5b6269">下一步: A5 / 失敗: G1</text><rect x="20" y="582" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="607" font-size="18" fill="#0b5d52">A5  |  Network</text><text x="34" y="633" font-size="17" fill="#263238">回報 READY；沿用已通的回報連線與認證。</text><text x="34" y="659" font-size="14" fill="#5b6269">下一步: L1 / 失敗: G1</text><rect x="20" y="681" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="706" font-size="18" fill="#0b5d52">L1  |  Listen</text><text x="34" y="732" font-size="17" fill="#263238">接收完整命令及動態點位；ScriptExit() 後走 Pass。</text><text x="34" y="758" font-size="14" fill="#5b6269">Pass: B1 / 失敗: G1</text><rect x="630" y="108" width="592" height="40" fill="#24675d"/><text x="644" y="136" font-size="20" fill="#ffffff">B  一次接令與分流</text><rect x="630" y="162" width="592" height="112" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="187" font-size="18" fill="#0b5d52">B1  |  Set</text><text x="644" y="213" font-size="17" fill="#263238">一次計算 cmd_class：1=完整有效新命令、2=同 ID/內容的完成重送</text><text x="644" y="237" font-size="17" fill="#263238">、0=拒絕。</text><text x="644" y="263" font-size="14" fill="#5b6269">下一步: B1A</text><rect x="630" y="285" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="310" font-size="18" fill="#0b5d52">B1A  |  If</text><text x="644" y="336" font-size="17" fill="#263238">cmd_class==1？這是 B1 分類出口，不重複做校正檢查。</text><text x="644" y="362" font-size="14" fill="#5b6269">是: B2 / 否: B1B</text><rect x="630" y="384" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="409" font-size="18" fill="#0b5d52">B1B  |  If</text><text x="644" y="435" font-size="17" fill="#263238">cmd_class==2？是則只重送快取，否則拒絕。</text><text x="644" y="461" font-size="14" fill="#5b6269">是: R1 / 否: E1</text><rect x="630" y="483" width="592" height="112" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="508" font-size="18" fill="#0b5d52">B2  |  Set</text><text x="644" y="534" font-size="17" fill="#263238">保存本輪 ID/hash/capture_id；清本輪 last_result；status</text><text x="644" y="558" font-size="17" fill="#263238">=1、robot_state=2。</text><text x="644" y="584" font-size="14" fill="#5b6269">下一步: B3</text><rect x="630" y="606" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="631" font-size="18" fill="#0b5d52">B3  |  Network</text><text x="644" y="657" font-size="17" fill="#263238">回報 BUSY，帶 session_id、cmd_id。</text><text x="644" y="683" font-size="14" fill="#5b6269">下一步: B4 / 失敗: G1</text><rect x="630" y="705" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="730" font-size="18" fill="#0b5d52">B4  |  If</text><text x="644" y="756" font-size="17" fill="#263238">kind=1（SCAN_PAIR）走拍攝；kind=2（MOVE）走移子分支。</text><text x="644" y="782" font-size="14" fill="#5b6269">拍攝: S1 / 移子: B5</text><rect x="630" y="804" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="829" font-size="18" fill="#0b5d52">B5  |  If</text><text x="644" y="855" font-size="17" fill="#263238">action=1 先清除目標棋；action=0 直接搬來源棋。</text><text x="644" y="881" font-size="14" fill="#5b6269">吃子: C1 / 一般: M1</text><rect x="630" y="903" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="928" font-size="18" fill="#0b5d52">R1  |  Network</text><text x="644" y="954" font-size="17" fill="#263238">相同命令只重送保存結果，不重新搬棋或拍照。</text><text x="644" y="980" font-size="14" fill="#5b6269">下一步: E2 / 失敗: G1</text><rect x="630" y="1002" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="1027" font-size="18" fill="#0b5d52">E1  |  Network</text><text x="644" y="1053" font-size="17" fill="#263238">回 REJECTED、cmd_id、錯誤碼；沒有動作。</text><text x="644" y="1079" font-size="14" fill="#5b6269">下一步: E2 / 失敗: G1</text><rect x="630" y="1101" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="1126" font-size="18" fill="#0b5d52">E2  |  Set</text><text x="644" y="1152" font-size="17" fill="#263238">清 cmd_ready；保留已接受 ID 與結果快取。</text><text x="644" y="1178" font-size="14" fill="#5b6269">下一步: L1</text></svg>