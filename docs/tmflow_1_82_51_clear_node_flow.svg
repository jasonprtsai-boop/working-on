<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1900" viewBox="0 0 3000 1900" role="img" aria-labelledby="title desc">
  <title id="title">TMflow 1.82.51 清楚流程圖（現場修正版）</title>
  <desc id="desc">先用安全高度假流程排除問題；右側工具仍只作設定。</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#32455f" /></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#158a4d" /></marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#cf3030" /></marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#10223f" flood-opacity="0.11"/></filter>
  </defs>
  <style>
    :root{--bg:#f5f7fb;--ink:#142033;--muted:#5b6b83;--border:#c6d3e5;--blue:#2f7cf6;--blue-soft:#e7f1ff;--cyan:#0891b2;--cyan-soft:#e7fbff;--green:#169b55;--green-soft:#e8f8ef;--orange:#ef7b22;--orange-soft:#fff3e3;--red:#d43b3b;--red-soft:#ffe9e9;--purple:#7c3aed;--purple-soft:#f1eaff;--yellow:#c99400;--yellow-soft:#fff7d1}
    .bg{fill:var(--bg)} .title{fill:var(--ink);font:600 44px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}.subtitle{fill:var(--muted);font:400 24px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}.body{fill:var(--ink);font:400 21px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}.small{fill:var(--muted);font:400 18px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}
    .lane-box,.node-box,.panel{fill:#fff;stroke:var(--border);stroke-width:2.2;filter:url(#shadow)}.lane-head,.lane-head-cover{fill:var(--blue-soft)}.lane.orange .lane-head,.lane.orange .lane-head-cover{fill:var(--orange-soft)}.lane.green .lane-head,.lane.green .lane-head-cover{fill:var(--green-soft)}.lane.cyan .lane-head,.lane.cyan .lane-head-cover{fill:var(--cyan-soft)}.lane.red .lane-head,.lane.red .lane-head-cover{fill:var(--red-soft)}.lane-title{fill:var(--ink);font:600 24px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}
    .node-id{fill:var(--ink);font:600 24px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}.node-body{fill:#273853;font:400 19px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}.node-strip{fill:var(--blue)}.node.orange .node-strip{fill:var(--orange)}.node.green .node-strip{fill:var(--green)}.node.cyan .node-strip{fill:var(--cyan)}.node.red .node-strip{fill:var(--red)}.type-pill{fill:#edf3fa;stroke:#d8e2ee;stroke-width:1}.type-text{fill:var(--muted);font:600 15px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}
    .label-bg{fill:var(--bg);stroke:#c7d3e4;stroke-width:1.2}.edge-label{fill:#40506a;font:600 17px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}.warn{fill:#b91c1c;font:600 21px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}.ok{fill:#166534;font:600 21px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}
  </style>
  <rect class="bg" width="3000" height="1900"/>
  <text class="title" text-anchor="start" font-weight="600"><tspan x="60" y="70">TMflow 1.82.51 清楚流程圖（現場修正版）</tspan></text>
  <text class="subtitle" text-anchor="start"><tspan x="60" y="110">先用安全高度假流程排除問題；右側工具仍只作設定。</tspan></text>
  <g class="node blue">
    <rect class="node-box" x="90" y="300" width="430" height="240" rx="12"/>
    <rect class="node-strip" x="90" y="300" width="12" height="240" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="114" y="338">1 初始化</tspan></text>
    <rect class="type-pill" x="382" y="315" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="440" y="337">Start/Set</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="114" y="372">A1 開始 / A2 歸零 / A3 </tspan><tspan x="114" y="396">關吸盤</tspan></text>
  </g><g class="node blue">
    <rect class="node-box" x="562" y="300" width="430" height="240" rx="12"/>
    <rect class="node-strip" x="562" y="300" width="12" height="240" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="586" y="338">2 安全就位</tspan></text>
    <rect class="type-pill" x="854" y="315" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="912" y="337">Point</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="586" y="372">A4 到 P_READY_SAFE / </tspan><tspan x="586" y="396">跳過通訊與等待</tspan></text>
  </g><g class="node orange">
    <rect class="node-box" x="1034" y="300" width="430" height="240" rx="12"/>
    <rect class="node-strip" x="1034" y="300" width="12" height="240" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="1058" y="338">3 測試命令</tspan></text>
    <rect class="type-pill" x="1326" y="315" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="1384" y="337">Set</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="1058" y="372">B1 心跳 / B2 ready / B</tspan><tspan x="1058" y="396">4 固定 action</tspan></text>
  </g><g class="node green">
    <rect class="node-box" x="1506" y="300" width="430" height="240" rx="12"/>
    <rect class="node-strip" x="1506" y="300" width="12" height="240" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="1530" y="338">4 安全假移動</tspan></text>
    <rect class="type-pill" x="1798" y="315" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="1856" y="337">If/Move</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="1530" y="372">B10 分支 / B11-B14 搬</tspan><tspan x="1530" y="396">移 / C1-C5 吃子</tspan></text>
  </g><g class="node cyan">
    <rect class="node-box" x="1978" y="300" width="430" height="240" rx="12"/>
    <rect class="node-strip" x="1978" y="300" width="12" height="240" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="2002" y="338">5 完成收尾</tspan></text>
    <rect class="type-pill" x="2270" y="315" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="2328" y="337">Point/Set/Wait</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="2002" y="372">F1 回安全點 / F2 完成 /</tspan><tspan x="2002" y="396"> F4/F5 清狀態</tspan></text>
  </g><g class="node red">
    <rect class="node-box" x="2450" y="300" width="430" height="240" rx="12"/>
    <rect class="node-strip" x="2450" y="300" width="12" height="240" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="2474" y="338">6 逐一加回</tspan></text>
    <rect class="type-pill" x="2742" y="315" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="2800" y="337">If/Net/IO</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="2474" y="372">重建 B7 / 加回通訊 / 最</tspan><tspan x="2474" y="396">後補 Z/吸盤</tspan></text>
  </g><g><path d="M 520 420 L 562 420" fill="none" stroke="#32455f" stroke-width="4" marker-end="url(#arrow)" /></g><g><path d="M 992 420 L 1034 420" fill="none" stroke="#32455f" stroke-width="4" marker-end="url(#arrow)" /></g><g><path d="M 1464 420 L 1506 420" fill="none" stroke="#32455f" stroke-width="4" marker-end="url(#arrow)" /></g><g><path d="M 1936 420 L 1978 420" fill="none" stroke="#32455f" stroke-width="4" marker-end="url(#arrow)" /></g><g><path d="M 2408 420 L 2450 420" fill="none" stroke="#32455f" stroke-width="4" marker-end="url(#arrow)" /></g><g class="node green">
    <rect class="node-box" x="110" y="720" width="780" height="360" rx="12"/>
    <rect class="node-strip" x="110" y="720" width="12" height="360" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="134" y="758">可用流程節點</tspan></text>
    <rect class="type-pill" x="752" y="735" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="810" y="757">Allowed</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="134" y="792">左側可拖進流程：設定、點位、移動、判斷、等待、</tspan><tspan x="134" y="816">跳轉、通訊、停止。</tspan></text>
  </g><g class="node red">
    <rect class="node-box" x="970" y="720" width="870" height="360" rx="12"/>
    <rect class="node-strip" x="970" y="720" width="12" height="360" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="994" y="758">不能當流程節點</tspan></text>
    <rect class="type-pill" x="1702" y="735" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="1760" y="757">Right panel</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="994" y="792">右側工具只作參數設定；不要把 ModbusDev、作業空間、計</tspan><tspan x="994" y="816">時、序列埠當節點。</tspan></text>
  </g><g class="node cyan">
    <rect class="node-box" x="1920" y="720" width="900" height="360" rx="12"/>
    <rect class="node-strip" x="1920" y="720" width="12" height="360" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="1944" y="758">目前先跳過</tspan></text>
    <rect class="type-pill" x="2682" y="735" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="2740" y="757">Test</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="1944" y="792">A5、Listen1、B3、B5、B6、B7、B8、F3 先不放在主測試</tspan><tspan x="1944" y="816">線。</tspan></text>
  </g><g class="node blue">
    <rect class="node-box" x="110" y="1220" width="1280" height="250" rx="12"/>
    <rect class="node-strip" x="110" y="1220" width="12" height="250" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="134" y="1258">卡關處理</tspan></text>
    <rect class="type-pill" x="1252" y="1235" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="1310" y="1257">B7</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="134" y="1292">active_to=1 理應通過；先跳過 B7，主線跑通後刪掉重建 If，再從 ==1 測起。</tspan></text>
  </g><g class="node orange">
    <rect class="node-box" x="1530" y="1220" width="1290" height="250" rx="12"/>
    <rect class="node-strip" x="1530" y="1220" width="12" height="250" rx="6"/>
    <text class="node-id" text-anchor="start" font-weight="600"><tspan x="1554" y="1258">後續順序</tspan></text>
    <rect class="type-pill" x="2682" y="1235" width="116" height="30" rx="15"/>
    <text class="type-text" text-anchor="middle"><tspan x="2740" y="1257">Safe</tspan></text>
    <text class="node-body" text-anchor="start"><tspan x="1554" y="1292">先 Move，再 If，再通訊與 Listen，最後才加入下降 Z 與吸盤 ON/OFF。</tspan></text>
  </g>
</svg>