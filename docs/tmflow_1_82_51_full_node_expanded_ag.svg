<svg xmlns="http://www.w3.org/2000/svg" width="1852" height="3010" viewBox="0 0 1852 3010" role="img" aria-label="完整節點與每個出口"><style>text{font-family:Microsoft JhengHei,Arial,sans-serif;letter-spacing:0}</style><rect width="100%" height="100%" fill="#f6f8f9"/><text x="28" y="42" font-size="25" fill="#263238">完整節點與每個出口</text><text x="28" y="74" font-size="15" fill="#526167">v3.0 / 2026-09-18 / 設計規格，尚未整合實機執行</text><rect x="20" y="108" width="592" height="40" fill="#24675d"/><text x="34" y="136" font-size="20" fill="#ffffff">A  啟動與等待</text><rect x="20" y="162" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="187" font-size="18" fill="#0b5d52">A1  |  Start</text><text x="34" y="213" font-size="17" fill="#263238">空載、已在已知起始區域時啟動；中斷持棋不走此入口。</text><text x="34" y="239" font-size="14" fill="#5b6269">下一步: A2</text><rect x="20" y="261" width="592" height="112" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="286" font-size="18" fill="#0b5d52">A2  |  Set</text><text x="34" y="312" font-size="17" fill="#263238">清空 bound_session_id 與命令快取；last_cmd_id=0、cmd_re</text><text x="34" y="336" font-size="17" fill="#263238">ady=false；只在新啟動執行。</text><text x="34" y="362" font-size="14" fill="#5b6269">下一步: A3</text><rect x="20" y="384" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="409" font-size="18" fill="#0b5d52">A3  |  Set / IO</text><text x="34" y="435" font-size="17" fill="#263238">DO3=RELEASE_LEVEL；初始化空載狀態。</text><text x="34" y="461" font-size="14" fill="#5b6269">下一步: A4</text><rect x="20" y="483" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="508" font-size="18" fill="#0b5d52">A4  |  Point</text><text x="34" y="534" font-size="17" fill="#263238">P_READY_SAFE；PTP，已校驗起始路徑，精準到位。</text><text x="34" y="560" font-size="14" fill="#5b6269">下一步: A5 / 失敗: G1</text><rect x="20" y="582" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="607" font-size="18" fill="#0b5d52">A5  |  Network</text><text x="34" y="633" font-size="17" fill="#263238">回報 READY；沿用已通的回報連線與認證。</text><text x="34" y="659" font-size="14" fill="#5b6269">下一步: L1 / 失敗: G1</text><rect x="20" y="681" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="706" font-size="18" fill="#0b5d52">L1  |  Listen</text><text x="34" y="732" font-size="17" fill="#263238">接收完整命令及動態點位；ScriptExit() 後走 Pass。</text><text x="34" y="758" font-size="14" fill="#5b6269">Pass: B1 / 失敗: G1</text><rect x="630" y="108" width="592" height="40" fill="#24675d"/><text x="644" y="136" font-size="20" fill="#ffffff">B  一次接令與分流</text><rect x="630" y="162" width="592" height="112" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="187" font-size="18" fill="#0b5d52">B1  |  Set</text><text x="644" y="213" font-size="17" fill="#263238">一次計算 cmd_class：1=完整有效新命令、2=同 ID/內容的完成重送</text><text x="644" y="237" font-size="17" fill="#263238">、0=拒絕。</text><text x="644" y="263" font-size="14" fill="#5b6269">下一步: B1A</text><rect x="630" y="285" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="310" font-size="18" fill="#0b5d52">B1A  |  If</text><text x="644" y="336" font-size="17" fill="#263238">cmd_class==1？這是 B1 分類出口，不重複做校正檢查。</text><text x="644" y="362" font-size="14" fill="#5b6269">是: B2 / 否: B1B</text><rect x="630" y="384" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="409" font-size="18" fill="#0b5d52">B1B  |  If</text><text x="644" y="435" font-size="17" fill="#263238">cmd_class==2？是則只重送快取，否則拒絕。</text><text x="644" y="461" font-size="14" fill="#5b6269">是: R1 / 否: E1</text><rect x="630" y="483" width="592" height="112" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="508" font-size="18" fill="#0b5d52">B2  |  Set</text><text x="644" y="534" font-size="17" fill="#263238">保存本輪 ID/hash/capture_id；清本輪 last_result；status</text><text x="644" y="558" font-size="17" fill="#263238">=1、robot_state=2。</text><text x="644" y="584" font-size="14" fill="#5b6269">下一步: B3</text><rect x="630" y="606" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="631" font-size="18" fill="#0b5d52">B3  |  Network</text><text x="644" y="657" font-size="17" fill="#263238">回報 BUSY，帶 session_id、cmd_id。</text><text x="644" y="683" font-size="14" fill="#5b6269">下一步: B4 / 失敗: G1</text><rect x="630" y="705" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="730" font-size="18" fill="#0b5d52">B4  |  If</text><text x="644" y="756" font-size="17" fill="#263238">kind=1（SCAN_PAIR）走拍攝；kind=2（MOVE）走移子分支。</text><text x="644" y="782" font-size="14" fill="#5b6269">拍攝: S1 / 移子: B5</text><rect x="630" y="804" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="829" font-size="18" fill="#0b5d52">B5  |  If</text><text x="644" y="855" font-size="17" fill="#263238">action=1 先清除目標棋；action=0 直接搬來源棋。</text><text x="644" y="881" font-size="14" fill="#5b6269">吃子: C1 / 一般: M1</text><rect x="630" y="903" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="928" font-size="18" fill="#0b5d52">R1  |  Network</text><text x="644" y="954" font-size="17" fill="#263238">相同命令只重送保存結果，不重新搬棋或拍照。</text><text x="644" y="980" font-size="14" fill="#5b6269">下一步: E2 / 失敗: G1</text><rect x="630" y="1002" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="1027" font-size="18" fill="#0b5d52">E1  |  Network</text><text x="644" y="1053" font-size="17" fill="#263238">回 REJECTED、cmd_id、錯誤碼；沒有動作。</text><text x="644" y="1079" font-size="14" fill="#5b6269">下一步: E2 / 失敗: G1</text><rect x="630" y="1101" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="1126" font-size="18" fill="#0b5d52">E2  |  Set</text><text x="644" y="1152" font-size="17" fill="#263238">清 cmd_ready；保留已接受 ID 與結果快取。</text><text x="644" y="1178" font-size="14" fill="#5b6269">下一步: L1</text><rect x="1240" y="108" width="592" height="40" fill="#24675d"/><text x="1254" y="136" font-size="20" fill="#ffffff">C  吃子：先移除目標棋</text><rect x="1240" y="162" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="1254" y="187" font-size="18" fill="#0b5d52">C1  |  Point</text><text x="1254" y="213" font-size="17" fill="#263238">P_DST_ABOVE；Line，安全高度已校驗路徑。</text><text x="1254" y="239" font-size="14" fill="#5b6269">下一步: C2 / 失敗: G1</text><rect x="1240" y="261" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="1254" y="286" font-size="18" fill="#0b5d52">C2  |  Point</text><text x="1254" y="312" font-size="17" fill="#263238">P_DST_PICK；Line 垂直下降、精準到位。</text><text x="1254" y="338" font-size="14" fill="#5b6269">下一步: C3 / 失敗: G1</text><rect x="1240" y="360" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="1254" y="385" font-size="18" fill="#0b5d52">C3  |  Set / IO</text><text x="1254" y="411" font-size="17" fill="#263238">DO3=SUCTION_LEVEL；只代表吸盤已啟動。</text><text x="1254" y="437" font-size="14" fill="#5b6269">下一步: C4</text><rect x="1240" y="459" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="1254" y="484" font-size="18" fill="#0b5d52">C4  |  Wait for</text><text x="1254" y="510" font-size="17" fill="#263238">等待 grip_wait_ms；無回授不宣稱已吸住。</text><text x="1254" y="536" font-size="14" fill="#5b6269">下一步: C5</text><rect x="1240" y="558" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="1254" y="583" font-size="18" fill="#0b5d52">C5  |  Point</text><text x="1254" y="609" font-size="17" fill="#263238">P_DST_ABOVE；Line 垂直抬升。</text><text x="1254" y="635" font-size="14" fill="#5b6269">下一步: C6 / 失敗: G1</text><rect x="1240" y="657" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="1254" y="682" font-size="18" fill="#0b5d52">C6  |  Point</text><text x="1254" y="708" font-size="17" fill="#263238">P_DROP_ABOVE；Line，維持已校驗高度與姿態。</text><text x="1254" y="734" font-size="14" fill="#5b6269">下一步: C7 / 失敗: G1</text><rect x="1240" y="756" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="1254" y="781" font-size="18" fill="#0b5d52">C7  |  Point</text><text x="1254" y="807" font-size="17" fill="#263238">P_DROP_RELEASE；Line 垂直下降、精準到位。</text><text x="1254" y="833" font-size="14" fill="#5b6269">下一步: C8 / 失敗: G1</text><rect x="1240" y="855" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="1254" y="880" font-size="18" fill="#0b5d52">C8  |  Set / IO</text><text x="1254" y="906" font-size="17" fill="#263238">DO3=RELEASE_LEVEL；棋子落入收納盒。</text><text x="1254" y="932" font-size="14" fill="#5b6269">下一步: C9</text><rect x="1240" y="954" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="1254" y="979" font-size="18" fill="#0b5d52">C9  |  Wait for</text><text x="1254" y="1005" font-size="17" fill="#263238">等待 release_wait_ms。</text><text x="1254" y="1031" font-size="14" fill="#5b6269">下一步: C10</text><rect x="1240" y="1053" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="1254" y="1078" font-size="18" fill="#0b5d52">C10  |  Point</text><text x="1254" y="1104" font-size="17" fill="#263238">P_DROP_ABOVE；Line 垂直抬升。</text><text x="1254" y="1130" font-size="14" fill="#5b6269">下一步: M1 / 失敗: G1</text><rect x="20" y="1235" width="592" height="40" fill="#24675d"/><text x="34" y="1263" font-size="20" fill="#ffffff">M  搬來源棋到目標格</text><rect x="20" y="1289" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="1314" font-size="18" fill="#0b5d52">M1  |  Point</text><text x="34" y="1340" font-size="17" fill="#263238">P_SRC_ABOVE；Line，已校驗安全高度路徑。</text><text x="34" y="1366" font-size="14" fill="#5b6269">下一步: M2 / 失敗: G1</text><rect x="20" y="1388" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="1413" font-size="18" fill="#0b5d52">M2  |  Point</text><text x="34" y="1439" font-size="17" fill="#263238">P_SRC_PICK；Line 垂直下降、精準到位。</text><text x="34" y="1465" font-size="14" fill="#5b6269">下一步: M3 / 失敗: G1</text><rect x="20" y="1487" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="1512" font-size="18" fill="#0b5d52">M3  |  Set / IO</text><text x="34" y="1538" font-size="17" fill="#263238">DO3=SUCTION_LEVEL。</text><text x="34" y="1564" font-size="14" fill="#5b6269">下一步: M4</text><rect x="20" y="1586" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="1611" font-size="18" fill="#0b5d52">M4  |  Wait for</text><text x="34" y="1637" font-size="17" fill="#263238">等待 grip_wait_ms；單顆測試確認吸附。</text><text x="34" y="1663" font-size="14" fill="#5b6269">下一步: M5</text><rect x="20" y="1685" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="1710" font-size="18" fill="#0b5d52">M5  |  Point</text><text x="34" y="1736" font-size="17" fill="#263238">P_SRC_ABOVE；Line 垂直抬升。</text><text x="34" y="1762" font-size="14" fill="#5b6269">下一步: M6 / 失敗: G1</text><rect x="20" y="1784" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="1809" font-size="18" fill="#0b5d52">M6  |  Point</text><text x="34" y="1835" font-size="17" fill="#263238">P_DST_ABOVE；Line，保持轉移高度及姿態。</text><text x="34" y="1861" font-size="14" fill="#5b6269">下一步: M7 / 失敗: G1</text><rect x="20" y="1883" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="1908" font-size="18" fill="#0b5d52">M7  |  Point</text><text x="34" y="1934" font-size="17" fill="#263238">P_DST_PLACE；Line 垂直下降、精準到位。</text><text x="34" y="1960" font-size="14" fill="#5b6269">下一步: M8 / 失敗: G1</text><rect x="20" y="1982" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="2007" font-size="18" fill="#0b5d52">M8  |  Set / IO</text><text x="34" y="2033" font-size="17" fill="#263238">DO3=RELEASE_LEVEL。</text><text x="34" y="2059" font-size="14" fill="#5b6269">下一步: M9</text><rect x="20" y="2081" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="2106" font-size="18" fill="#0b5d52">M9  |  Wait for</text><text x="34" y="2132" font-size="17" fill="#263238">等待 release_wait_ms。</text><text x="34" y="2158" font-size="14" fill="#5b6269">下一步: M10</text><rect x="20" y="2180" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="2205" font-size="18" fill="#0b5d52">M10  |  Point</text><text x="34" y="2231" font-size="17" fill="#263238">P_DST_ABOVE；Line 垂直抬升。</text><text x="34" y="2257" font-size="14" fill="#5b6269">下一步: M11 / 失敗: G1</text><rect x="20" y="2279" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="2304" font-size="18" fill="#0b5d52">M11  |  Point</text><text x="34" y="2330" font-size="17" fill="#263238">P_READY_SAFE；已校驗空載路徑，精準到位，再拍兩張複驗。</text><text x="34" y="2356" font-size="14" fill="#5b6269">下一步: S1 / 失敗: G1</text><rect x="630" y="1235" width="592" height="40" fill="#24675d"/><text x="644" y="1263" font-size="20" fill="#ffffff">S  共用雙張拍攝</text><rect x="630" y="1289" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="1314" font-size="18" fill="#0b5d52">S1  |  Point</text><text x="644" y="1340" font-size="17" fill="#263238">P_PHOTO_A_APPROACH；已校驗空載路徑，PTP。</text><text x="644" y="1366" font-size="14" fill="#5b6269">下一步: S2 / 失敗: G1</text><rect x="630" y="1388" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="1413" font-size="18" fill="#0b5d52">S2  |  Point</text><text x="644" y="1439" font-size="17" fill="#263238">P_PHOTO_A；Line、精準到位，對準近側棋盤。</text><text x="644" y="1465" font-size="14" fill="#5b6269">下一步: S3 / 失敗: G1</text><rect x="630" y="1487" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="1512" font-size="18" fill="#0b5d52">S3  |  Wait for</text><text x="644" y="1538" font-size="17" fill="#263238">等待現場量測的 settle_ms。</text><text x="644" y="1564" font-size="14" fill="#5b6269">下一步: S4</text><rect x="630" y="1586" width="592" height="112" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="1611" font-size="18" fill="#0b5d52">S4  |  Vision</text><text x="644" y="1637" font-size="17" fill="#263238">JOB_BOARD_A：新拍 A 圖，上傳 capture_id/view=A；接收 ACK</text><text x="644" y="1661" font-size="17" fill="#263238"> 後繼續。</text><text x="644" y="1687" font-size="14" fill="#5b6269">下一步: S5 / 失敗: G1</text><rect x="630" y="1709" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="1734" font-size="18" fill="#0b5d52">S5  |  Point</text><text x="644" y="1760" font-size="17" fill="#263238">P_PHOTO_A_APPROACH；Line 退出拍照位置。</text><text x="644" y="1786" font-size="14" fill="#5b6269">下一步: S6 / 失敗: G1</text><rect x="630" y="1808" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="1833" font-size="18" fill="#0b5d52">S6  |  Point</text><text x="644" y="1859" font-size="17" fill="#263238">P_READY_SAFE；已校驗空載轉移路徑。</text><text x="644" y="1885" font-size="14" fill="#5b6269">下一步: S7 / 失敗: G1</text><rect x="630" y="1907" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="1932" font-size="18" fill="#0b5d52">S7  |  Point</text><text x="644" y="1958" font-size="17" fill="#263238">P_PHOTO_B_APPROACH；已校驗空載路徑，PTP。</text><text x="644" y="1984" font-size="14" fill="#5b6269">下一步: S8 / 失敗: G1</text><rect x="630" y="2006" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="2031" font-size="18" fill="#0b5d52">S8  |  Point</text><text x="644" y="2057" font-size="17" fill="#263238">P_PHOTO_B；Line、精準到位，對準遠側棋盤。</text><text x="644" y="2083" font-size="14" fill="#5b6269">下一步: S9 / 失敗: G1</text><rect x="630" y="2105" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="2130" font-size="18" fill="#0b5d52">S9  |  Wait for</text><text x="644" y="2156" font-size="17" fill="#263238">等待 settle_ms。</text><text x="644" y="2182" font-size="14" fill="#5b6269">下一步: S10</text><rect x="630" y="2204" width="592" height="112" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="2229" font-size="18" fill="#0b5d52">S10  |  Vision</text><text x="644" y="2255" font-size="17" fill="#263238">JOB_BOARD_B：新拍 B 圖，上傳相同 capture_id/view=B；接收</text><text x="644" y="2279" font-size="17" fill="#263238"> ACK 後繼續。</text><text x="644" y="2305" font-size="14" fill="#5b6269">下一步: S11 / 失敗: G1</text><rect x="630" y="2327" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="2352" font-size="18" fill="#0b5d52">S11  |  Point</text><text x="644" y="2378" font-size="17" fill="#263238">P_PHOTO_B_APPROACH；Line 退出拍照位置。</text><text x="644" y="2404" font-size="14" fill="#5b6269">下一步: S12 / 失敗: G1</text><rect x="630" y="2426" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="644" y="2451" font-size="18" fill="#0b5d52">S12  |  Point</text><text x="644" y="2477" font-size="17" fill="#263238">P_READY_SAFE；精準到位後才回 DONE。</text><text x="644" y="2503" font-size="14" fill="#5b6269">下一步: F1 / 失敗: G1</text><rect x="1240" y="1235" width="592" height="40" fill="#24675d"/><text x="1254" y="1263" font-size="20" fill="#ffffff">F  完成與下一輪</text><rect x="1240" y="1289" width="592" height="112" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="1254" y="1314" font-size="18" fill="#0b5d52">F1  |  Set</text><text x="1254" y="1340" font-size="17" fill="#263238">保存 DONE、cmd_id、capture_id；status=2、robot_state=1</text><text x="1254" y="1364" font-size="17" fill="#263238">。</text><text x="1254" y="1390" font-size="14" fill="#5b6269">下一步: F2</text><rect x="1240" y="1412" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="1254" y="1437" font-size="18" fill="#0b5d52">F2  |  Network</text><text x="1254" y="1463" font-size="17" fill="#263238">回 DONE 與編號：動作及拍攝結束，不等於辨識通過。</text><text x="1254" y="1489" font-size="14" fill="#5b6269">下一步: F3 / 失敗: G1</text><rect x="1240" y="1511" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="1254" y="1536" font-size="18" fill="#0b5d52">F3  |  Set</text><text x="1254" y="1562" font-size="17" fill="#263238">cmd_ready=false；保留完成編號及結果；回 Listen。</text><text x="1254" y="1588" font-size="14" fill="#5b6269">下一步: L1</text><rect x="20" y="2560" width="592" height="40" fill="#9b3434"/><text x="34" y="2588" font-size="20" fill="#ffffff">G  明確失敗出口</text><rect x="20" y="2614" width="592" height="112" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="2639" font-size="18" fill="#0b5d52">G1  |  Set</text><text x="34" y="2665" font-size="17" fill="#263238">保存故障上下文；活動命令未結束才存 ERR，不覆蓋既有 DONE；不強</text><text x="34" y="2689" font-size="17" fill="#263238">制切 DO3。</text><text x="34" y="2715" font-size="14" fill="#5b6269">下一步: G2</text><rect x="20" y="2737" width="592" height="112" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="2762" font-size="18" fill="#0b5d52">G2  |  Network</text><text x="34" y="2788" font-size="17" fill="#263238">限時回故障通知；已有 DONE 則重送 DONE 並另報通訊故障；失敗也</text><text x="34" y="2812" font-size="17" fill="#263238">停止。</text><text x="34" y="2838" font-size="14" fill="#5b6269">下一步: G3 / 失敗: G3</text><rect x="20" y="2860" width="592" height="88" rx="4" fill="#ffffff" stroke="#c8d0d4"/><text x="34" y="2885" font-size="18" fill="#0b5d52">G3  |  Stop</text><text x="34" y="2911" font-size="17" fill="#263238">停止專案、保留結果；依現場持物狀態人工復歸。</text><text x="34" y="2937" font-size="14" fill="#5b6269">停止</text></svg>