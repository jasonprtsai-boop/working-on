<section id="view-landing" class="view-landing">
    <div class="landing-header">
        <div class="badge">S.M.A.R.T. V2.5 INDUSTRIAL</div>
        <h1>S.M.A.R.T. <br><span>CHESS ROBOT</span></h1>
        <p>整合象棋引擎、YOLO 視覺辨識與機械手臂控制的即時對弈平台。</p>
    </div>

    <div class="role-cards">
        <button id="btn-role-player" type="button" class="role-card glass" aria-label="Enter Player Mode">
            <div class="card-icon">P</div>
            <h2>玩家模式</h2>
            <div class="card-features">
                <span>即時棋盤同步</span>
                <span>對局狀態顯示</span>
                <span>安全監控</span>
            </div>
        </button>

        <button id="btn-role-console" type="button" class="role-card glass" aria-label="Enter Admin Console Mode">
            <div class="card-icon">C</div>
            <h2>主控台模式</h2>
            <div class="card-features">
                <span>系統狀態監控</span>
                <span>Vision 診斷</span>
                <span>控制與匯出</span>
            </div>
        </button>

        <button id="btn-role-setup" type="button" class="role-card glass" aria-label="Enter Setup Mode">
            <div class="card-icon">S</div>
            <h2>系統設定</h2>
            <div class="card-features">
                <span>相機校正</span>
                <span>三軸參數</span>
                <span>死棋區域</span>
            </div>
        </button>
    </div>
</section>
