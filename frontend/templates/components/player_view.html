<section id="view-player" class="view-player hidden">
    <nav class="top-nav">
        <div class="logo">玩家 <span>對局</span></div>
        <button id="btn-exit" type="button" class="btn-exit" aria-label="返回主畫面">返回主畫面</button>
    </nav>

    <div id="player-start-panel" class="player-start-panel">
        <div class="player-start-card">
            <span class="player-start-kicker">玩家介面</span>
            <h1>準備開始對局</h1>
            <p class="player-start-copy">棋盤會是主要畫面，左側保留回合、辨識與安全狀態。</p>
            <div id="player-start-preflight-alert" class="player-start-alert hidden" data-state="standby" role="status" aria-live="polite"></div>
            <button id="btn-player-start" type="button" class="btn-player-start">開始對局</button>
        </div>
    </div>

    <div id="game-arena" class="arena-layout-centered hidden">
        <div class="board-col-center">
            <div class="board-container">
                <div id="player-board" class="chess-board">
                    <div class="board-grid-line"></div>
                    <div class="river-label"><span>楚河</span><span>漢界</span></div>
                    <div class="palace-lines">
                        <svg class="palace-svg" style="top:0; left:37.5%; width:25%; height:22.22%;">
                            <line x1="0" y1="0" x2="100%" y2="100%" stroke="var(--border)" stroke-width="1" />
                            <line x1="100%" y1="0" x2="0" y2="100%" stroke="var(--border)" stroke-width="1" />
                        </svg>
                        <svg class="palace-svg" style="top:77.77%; left:37.5%; width:25%; height:22.22%;">
                            <line x1="0" y1="0" x2="100%" y2="100%" stroke="var(--border)" stroke-width="1" />
                            <line x1="100%" y1="0" x2="0" y2="100%" stroke="var(--border)" stroke-width="1" />
                        </svg>
                    </div>
                    <div id="board-pieces" class="piece-layer"></div>
                    <div class="scan-beam"></div>
                </div>
                <div id="board-busy-overlay" class="board-overlay hidden">
                    <div class="loader-ring"></div>
                    <p>系統辨識中...</p>
                </div>
            </div>

            <div class="player-guide-panel" aria-live="polite">
                <div class="player-guide-main">
                    <span class="player-guide-kicker" id="player-guide-step">等待開始</span>
                    <strong id="player-guide-action">請按下開始對局</strong>
                    <p id="player-guide-detail">依畫面提示移動棋子；機械手臂動作時請保持雙手離開棋盤。</p>
                </div>
                <div class="player-guide-status-grid">
                    <div class="player-guide-status" data-state="standby">
                        <span>回合</span>
                        <strong id="player-guide-turn">紅方移動</strong>
                    </div>
                    <div class="player-guide-status" id="player-guide-vision-card" data-state="standby">
                        <span>影像辨識</span>
                        <strong id="player-guide-vision">等待棋子移動</strong>
                    </div>
                    <div class="player-guide-status" id="player-guide-robot-card" data-state="standby">
                        <span>機械手臂</span>
                        <strong id="player-guide-robot">尚未動作</strong>
                    </div>
                    <div class="player-guide-status" data-state="standby">
                        <span>AI 難度</span>
                        <strong id="player-guide-ai">陪伴預設</strong>
                    </div>
                </div>
            </div>

            <div class="player-turn-panel" aria-live="polite">
                <span class="player-turn-label">現在輪到</span>
                <span id="player-turn-indicator" class="turn-indicator-pill red">紅方移動</span>
            </div>
            <div class="player-control-strip">
                <div class="player-main-actions">
                    <button id="btn-player-vision-capture" type="button" class="btn-remote success">我已下棋</button>
                    <button id="btn-player-end-game" type="button" class="btn-remote danger secondary">結束對局</button>
                </div>
                <div class="player-robot-start-group" aria-label="機械手臂啟動">
                    <div id="player-robot-safety-warning" class="player-robot-safety-warning" role="alert">
                        警告：機械手臂即將啟動，請勿靠近棋盤與手臂工作範圍。
                    </div>
                    <button id="btn-start-tmflow" type="button" class="btn-remote danger">啟動機械手臂流程</button>
                </div>
            </div>
        </div>
    </div>
</section>
